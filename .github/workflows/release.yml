name: Publish mod catalog
on:
  push:
    branches: [main]
    tags: ['mods-v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/package_mods.py
      - uses: actions/upload-artifact@v4
        with:
          name: mod-catalog
          path: build/release/cosmic-forge-mods.json
  release:
    if: startsWith(github.ref, 'refs/tags/mods-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-catalog
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --latest --title "$TAG" --notes 'Declarative COSMIC Forge mod catalog. Requires Forge 0.9 or newer; engine requirements are declared per mod.'
